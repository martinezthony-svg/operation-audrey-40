<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opération Audrey 40</title>

<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --accent:#f59e0b;
    --success:#22c55e;
    --text:#f8fafc;
    --muted:#cbd5e1;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
    line-height:1.6;
}

header{
    text-align:center;
    padding:60px 20px;
}

h1{
    font-size:3rem;
    margin-bottom:10px;
}

.subtitle{
    color:var(--muted);
    font-size:1.2rem;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:var(--card);
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.card h2{
    margin-bottom:15px;
    color:var(--accent);
}

.countdown{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:15px;
    text-align:center;
}

.timebox{
    background:#0f172a;
    border-radius:15px;
    padding:20px;
}

.number{
    font-size:2rem;
    font-weight:bold;
}

.label{
    color:var(--muted);
}

.status{
    list-style:none;
}

.status li{
    padding:10px;
    margin-bottom:8px;
