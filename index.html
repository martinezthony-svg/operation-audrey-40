<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opération Audrey 40</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Segoe UI,Arial,sans-serif;
background:#08111f;
color:#fff;
line-height:1.6;
}
header{
background:linear-gradient(135deg,#06152a,#12284a);
padding:60px 20px;
text-align:center;
}
header h1{
font-size:clamp(2rem,5vw,4rem);
margin-bottom:15px;
}
header p{
color:#c8d3e0;
}
.container{
max-width:1100px;
margin:auto;
padding:20px;
}
.card{
background:#17263d;
padding:25px;
margin-bottom:25px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,.25);
}
h2{
color:#ffc857;
margin-bottom:15px;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}
.box{
background:#071224;
padding:20px;
text-align:center;
border-radius:15px;
}
.num{
font-size:2rem;
font-weight:bold;
}
.progress{
height:24px;
background:#3a4b64;
border-radius:30px;
overflow:hidden;
}
.progress span{
display:block;
height:100%;
width:90%;
background:#22c55e;
text-align:center;
font-weight:bold;
}
.timeline{
border-left:4px solid #ffc857;
padding-left:20px;
}
.timeline div{
margin-bottom:20px;
}
.timeline strong{
color:#ffc857;
}
ul{
padding-left:20px;
}
.success{
background:#14532d;
padding:12px;
margin-bottom:10px;
border-radius:10px;
}
.alert{
background:#7c2d12;
padding:15px;
border-radius:10px;
}
button{
background:#ffc857;
border:none;
padding:12px 20px;
font-weight:bold;
cursor:pointer;
border-radius:10px;
}
input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
}
.secret{
display:none;
margin-top:20px;
}
footer{
padding:40px;
text-align:center;
color:#c8d3e0;
}
</style>
</head>
<body>

<header>
<h1>🕵️ OPÉRATION AUDREY 40</h1>
<p>Dossier confidentiel • Double surprise • Accès réservé aux agents</p>
</header>

<div class="container">

<div class="card">
<h2>⏳ Compte à rebours</h2>

<div class="grid">

<div class="box">
<div class="num" id="days">0</div>
<div>Jours</div>
</div>

<div class="box">
<div class="num" id="hours">0</div>
<div>Heures
